<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>sl-to-garmin logo</title>
  <desc>Sri Lanka island silhouette with topo contour lines over the hill country, a magenta Garmin-style route from the west coast and a Garmin-blue GPS navigation cursor, inside an ocean badge with a Garmin-blue ring.</desc>
  <defs>
    <clipPath id="island-clip">
      <path d="M113 25 C105 31 99 42 96 55 C94 62 94 68 95 74 C89 90 81 110 77 130 C73 150 76 168 86 184 C96 201 110 211 126 212 C142 213 156 204 163 190 C171 175 173 158 169 141 C165 122 158 102 149 85 C140 69 133 58 128 50 C124 43 120 36 118 31 C116 27 115 25 113 25 Z"/>
    </clipPath>
  </defs>

  <!-- ocean badge -->
  <circle cx="120" cy="120" r="118" fill="#0d3b66"/>
  <g fill="none" stroke="#1a6fa8" stroke-width="3" stroke-linecap="round">
    <path d="M22 88 q10 -8 20 0 q10 8 20 0"/>
    <path d="M178 88 q10 -8 20 0 q10 8 20 0"/>
    <path d="M32 190 q8 -6 16 0 q8 6 16 0"/>
    <path d="M176 190 q8 -6 16 0 q8 6 16 0"/>
  </g>

  <!-- Adam's Bridge chain toward India -->
  <circle cx="88" cy="34" r="2.6" fill="#2e9e6b"/>
  <circle cx="76" cy="26" r="2.3" fill="#2e9e6b"/>
  <circle cx="64" cy="18" r="2" fill="#2e9e6b"/>
  <circle cx="53" cy="11" r="1.8" fill="#2e9e6b"/>

  <!-- Jaffna islets -->
  <circle cx="128" cy="24" r="2.4" fill="#2e9e6b"/>
  <circle cx="140" cy="18" r="2" fill="#2e9e6b"/>

  <!-- Sri Lanka island: pointed Jaffna north, broad rounded south -->
  <path d="M113 25 C105 31 99 42 96 55 C94 62 94 68 95 74 C89 90 81 110 77 130 C73 150 76 168 86 184 C96 201 110 211 126 212 C142 213 156 204 163 190 C171 175 173 158 169 141 C165 122 158 102 149 85 C140 69 133 58 128 50 C124 43 120 36 118 31 C116 27 115 25 113 25 Z"
        fill="#2e9e6b" stroke="#1c6b47" stroke-width="3"/>

  <!-- topo contours over the central highlands -->
  <g clip-path="url(#island-clip)" fill="none" stroke="#a8e0c0" stroke-width="2.5" stroke-linecap="round">
    <path d="M78 158 C78 132 96 114 122 114 C150 114 168 132 168 158 C168 180 150 196 122 196 C96 196 78 180 78 158 Z"/>
    <path d="M92 157 C92 141 104 129 122 129 C141 129 153 141 153 157 C153 171 141 182 122 182 C104 182 92 171 92 157 Z"/>
    <path d="M105 156 C105 147 112 141 122 141 C133 141 140 147 140 156 C140 164 133 170 122 170 C112 170 105 164 105 156 Z"/>
  </g>

  <!-- magenta route: Colombo (west coast) to Kandy (hill country) -->
  <path d="M77 140 C90 142 99 146 107 151 C112 154 116 156 119 158"
        fill="none" stroke="#ff2fd6" stroke-width="6" stroke-dasharray="10 7" stroke-linecap="round"/>

  <!-- Garmin-blue GPS navigation cursor in the hill country -->
  <path d="M120 128 L139 162 L120 153 L101 162 Z"
        fill="#007cc3" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Garmin-blue badge ring -->
  <circle cx="120" cy="120" r="118" fill="none" stroke="#007cc3" stroke-width="5"/>
</svg>
