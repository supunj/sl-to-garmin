# Build configuration for sl-to-garmin (Garmin Drive only).
# Sourced by lib/common.sh after PROJECT_ROOT is set; may reference
# $PROJECT_ROOT. Every value can be overridden from the environment
# (this is how test/build_map_default.sh switches to the default style).

# --- Product identity -------------------------------------------------------
FID=${FID:-53130}
PID=${PID:-1}
SERIES_NAME=${SERIES_NAME:-sl-topo}
AREA_NAME=${AREA_NAME:-sl}

# --- Style / TYP (Garmin Drive 52/66 family only) ---------------------------
STYLE=${STYLE:-drive66}
# Note: ${TYP_FILE-...} without colon so an empty override stays empty.
TYP_FILE=${TYP_FILE-"$PROJECT_ROOT/typ/drive66.txt"}

# --- Locations ---------------------------------------------------------------
# Source data. Point DATA_DIR elsewhere (e.g. another disk) to keep the big
# PBF/HGT files out of the project tree.
DATA_DIR=${DATA_DIR:-"$PROJECT_ROOT/data"}
# Build artifacts (replaces the old tmp/). Wiped on every build.
BUILD_DIR=${BUILD_DIR:-"$PROJECT_ROOT/build"}
# Final, device-ready output.
DIST_DIR="$BUILD_DIR/dist"

# --- Source data --------------------------------------------------------------
SOURCE_MAP_NAME=${SOURCE_MAP_NAME:-sri-lanka-latest.osm.pbf}
CLEANSED_MAP_NAME=${CLEANSED_MAP_NAME:-sri-lanka-cleansed.osm.pbf}
CONTOURS_NAME=${CONTOURS_NAME:-sl-contours.osm.pbf}
POLY_FILE=${POLY_FILE:-"$DATA_DIR/poly/sri-lanka.poly"}
GEOFABRIK_URL=${GEOFABRIK_URL:-https://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf}

# DEM tiles used by mkgmap --dem. data/hgt holds SRTM3 tiles;
# data/hgt-srtm1 holds the higher-resolution SRTM1 set — switch DEM_DIR to it
# if you want finer hill shading.
DEM_DIR=${DEM_DIR:-"$DATA_DIR/hgt"}

# --- Java ---------------------------------------------------------------------
JAVA_CMD=${JAVA_CMD:-/usr/bin/java}
JAVA_HEAP=${JAVA_HEAP:-8192M}

# --- PostgreSQL (cleanse stage only) ------------------------------------------
# Dedicated role. psql authenticates via ~/.pgpass or trust auth — never a
# hardcoded password here. osmosis uses JDBC (which does not read ~/.pgpass),
# so if the server does not trust localhost connections for this role, export
# PG_PASSWORD before running cleanse_data.sh.
# One-time setup:  CREATE ROLE osm_build LOGIN CREATEDB SUPERUSER;
# (SUPERUSER is needed to create the postgis/hstore extensions in the scratch
# database; see README.)
PG_DB_NAME=${PG_DB_NAME:-osm_build}
PG_HOST=${PG_HOST:-localhost}
PG_PORT=${PG_PORT:-5432}
PG_USER=${PG_USER:-osm_build}
PG_PASSWORD=${PG_PASSWORD:-}
